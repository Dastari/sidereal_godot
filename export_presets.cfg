[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="client-settings.json,InventoryUi/item-seed-v1.json,InventoryUi/Icons/manifest.json,Assets/World/*.json,Assets/Frontend/*.json,Assets/Environment/*.json,Assets/Crew/*.json,Assets/Crew/*.bin,Assets/Combat/*.json"
exclude_filter="Tests/*,Bindings/*,scripts/*,ops/*,.github/*,*.csproj,*.sln,*.md,*.toml,global.json,packages.*.lock.json,download.html,client-settings.network-test.json,*.local.json"
export_path="output/godot/windows/Sidereal.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]
custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/product_name="Sidereal Native Evaluation"
application/file_version="0.4.4.0"
application/product_version="0.4.4.0"
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false

